name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESOLVEFLOW_RECEIPT_SECRET: ci-receipt-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint backend
        run: flake8 backend

      - name: Smoke seed demo database
        run: python -m backend.db.seed_demo_dashboard --db-path /tmp/resolveflow-ci.db

      - name: Run all backend test scripts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/test_*.py; do
            echo "::group::${test_file}"
            python -B "${test_file}"
            echo "::endgroup::"
          done

  frontend-checks:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
